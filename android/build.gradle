buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

// Ninja on Windows cannot reliably stat long prefab paths in deep checkouts.
// Keep native intermediates in a short, checkout-specific cache; source stays here.
if (System.getProperty('os.name').toLowerCase().contains('windows')) {
    def checkoutKey = Integer.toHexString(rootDir.absolutePath.hashCode())
    def nativeRoot = new File(System.getProperty('user.home'), ".rc-native/${checkoutKey}")
    subprojects { module ->
        ['com.android.application', 'com.android.library'].each { androidPlugin ->
            module.plugins.withId(androidPlugin) {
                module.extensions.getByName('android').externalNativeBuild.cmake.buildStagingDirectory =
                    new File(nativeRoot, module.name)
            }
        }
    }
}

apply plugin: "com.facebook.react.rootproject"
