appId: ${APP_ID}
name: COL-E04 E07 E09 - purchase and persistence
---
- launchApp:
    clearState: true
- assertVisible:
    id: credits.balance
    text: '1.000 kredit.*'
- scrollUntilVisible:
    element:
      id: artwork.art-lumen
    direction: DOWN
- tapOn:
    id: artwork.art-lumen
- scrollUntilVisible:
    element:
      id: purchase.open
    direction: DOWN
- assertVisible: '250 kredit'
- tapOn:
    id: purchase.open
- scrollUntilVisible:
    element:
      id: purchase.confirm
    direction: DOWN
- assertVisible: '1.000 kredit'
- assertVisible: '250 kredit'
- assertVisible: '750 kredit'
- takeScreenshot: purchase-confirmation
- doubleTapOn:
    id: purchase.confirm
- assertVisible:
    id: purchase.success.balance
    text: '750 kredit'
- takeScreenshot: purchase-success
- stopApp
- launchApp
- assertVisible:
    id: credits.balance
    text: '750 kredit.*'
- tapOn:
    id: tab.collection
- assertVisible: '.*Lumen.*'
- takeScreenshot: purchase-persisted
